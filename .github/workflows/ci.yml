name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: bundle install
        run: nix develop --command bash -c 'bundle install --jobs 4 --retry 3'

      - name: rspec
        run: nix develop --command bash -c 'bundle exec rspec'

      - name: rubocop
        run: nix develop --command bash -c 'bundle exec rubocop'
