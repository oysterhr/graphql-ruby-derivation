# Generic Ruby style rules, ported from Oyster's `.rubocop_standard.yml`
# (../oyster/.rubocop_standard.yml) minus Rails-specific cops and the
# Oyster-internal custom cop files, neither of which apply to a standalone
# gem. See AGENTS.md "Decisions on record" for why this base was chosen.

plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 3.1

### Cops ###

Bundler/GemFilename:
  Enabled: true

Bundler/OrderedGems:
  Enabled: true

Gemspec/OrderedDependencies:
  Enabled: true

Gemspec/RubyVersionGlobalsUsage:
  Enabled: true

Gemspec/RequiredRubyVersion:
  Enabled: true

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/ArrayAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/BlockAlignment:
  Enabled: true
  EnforcedStyleAlignWith: start_of_block

Layout/BlockEndNewline:
  Enabled: true

Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/EmptyLineAfterGuardClause:
  Enabled: true

Layout/EmptyLineBetweenDefs:
  Enabled: true
  AllowAdjacentOneLineDefs: true

Layout/EmptyLinesAroundArguments:
  Enabled: true

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true

Layout/EmptyLinesAroundBlockBody:
  Enabled: true

Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstArrayElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/FirstHashElementLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/FirstMethodArgumentLineBreak:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/FirstParameterIndentation:
  Enabled: true

Layout/HashAlignment:
  Enabled: true
  EnforcedLastArgumentHashStyle: ignore_implicit

Layout/MultilineArrayBraceLayout:
  Enabled: true

Layout/MultilineArrayLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/MultilineBlockLayout:
  Enabled: true

Layout/MultilineHashBraceLayout:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true
  AllowMultilineFinalElement: true

Layout/ParameterAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/SpaceAroundBlockParameters:
  Enabled: true

Layout/SpaceBeforeBlockBraces:
  Enabled: true

Layout/SpaceBeforeBrackets:
  Enabled: true

Layout/SpaceInsideBlockBraces:
  Enabled: true

Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  EnforcedStyle: no_space

Lint/AmbiguousRange:
  Enabled: true

Lint/DisjunctiveAssignmentInConstructor:
  Enabled: true

Lint/DuplicateBranch:
  Enabled: true

Lint/EmptyBlock:
  Enabled: true

Lint/EmptyClass:
  Enabled: true

Lint/EmptyConditionalBody:
  Enabled: true

Lint/EmptyFile:
  Enabled: true

Lint/EmptyInPattern:
  Enabled: true

Lint/HashCompareByIdentity:
  Enabled: true

Lint/HeredocMethodCallPosition:
  Enabled: true

Lint/LambdaWithoutLiteralBlock:
  Enabled: true

Lint/NoReturnInBeginEndBlocks:
  Enabled: true

Lint/PercentStringArray:
  Enabled: true

Lint/RedundantCopEnableDirective:
  Enabled: true

Lint/RedundantDirGlobSort:
  Enabled: true

Lint/RedundantSafeNavigation:
  Enabled: true

Lint/ScriptPermission:
  Enabled: true

Lint/SendWithMixinArgument:
  Enabled: true

Lint/StructNewOverride:
  Enabled: true

Lint/SuppressedException:
  Enabled: true

Lint/SymbolConversion:
  Enabled: true

Lint/ToEnumArguments:
  Enabled: true

Lint/ToJSON:
  Enabled: true

Lint/UnexpectedBlockArity:
  Enabled: true

Lint/UnmodifiedReduceAccumulator:
  Enabled: true

Lint/UnreachableLoop:
  Enabled: true

Lint/UnusedBlockArgument:
  Enabled: true

Lint/UselessAccessModifier:
  Enabled: true

Lint/UselessMethodDefinition:
  Enabled: true

Metrics/BlockNesting:
  Enabled: true

Metrics/BlockLength:
  Enabled: true
  Max: 192

Metrics/ClassLength:
  Enabled: true
  Max: 494

Metrics/ModuleLength:
  Enabled: true
  Max: 451

Naming/AccessorMethodName:
  Enabled: true

Naming/AsciiIdentifiers:
  Enabled: true

Naming/BlockForwarding:
  Enabled: true

Naming/FileName:
  Enabled: true
  Exclude:
    # SPEC.md §1.1: `lib/graphql-ruby-derivation.rb` is a literal require-path alias for
    # `graphql/derivation` and must keep the gem name's hyphens.
    - "lib/graphql-ruby-derivation.rb"

Naming/HeredocDelimiterNaming:
  Enabled: true

Naming/MemoizedInstanceVariableName:
  Enabled: true

Naming/MethodName:
  Enabled: true

Naming/MethodParameterName:
  Enabled: true
  AllowedNames: as, at, by, db, id, in, io, ip, of, on, os, pp, to, cc

Naming/PredicatePrefix:
  Enabled: true
  Exclude:
    - "spec/**/*"

Naming/VariableNumber:
  Enabled: true

Performance/DeletePrefix:
  Enabled: true

Performance/DeleteSuffix:
  Enabled: true

Performance/MethodObjectAsBlock:
  Enabled: true

Performance/RedundantEqualityComparisonBlock:
  Enabled: true

Performance/StringInclude:
  Enabled: true

Performance/Sum:
  Enabled: true

# Cop's default acronym-splitting heuristic would expect spec/graph_ql/*, but this codebase
# follows graphql-ruby's own convention of treating "GraphQL" as a single capitalized word.
#
# The pick_dsl specs are excluded: SPEC.md §1.3 pins the lib files to
# pick_dsl/arguments.rb and pick_dsl/fields.rb (matching the directory's own
# arguments/fields naming, not the PickArguments/PickFields class names), so
# their specs mirror that lib path rather than the class name.
#
# The engines/argument_derivation_spec.rb is excluded for the same reason:
# SPEC.md §1.3 pins the lib file to engines/argument_derivation.rb (mirroring
# the lib/engines/ directory), but `GraphQL::Derivation::ArgumentDerivation`
# is a top-level module under `GraphQL::Derivation`, not nested under an
# `Engines` namespace -- so the cop's class-name-derived expected path
# (spec/graphql/derivation/argument_derivation_spec.rb) doesn't match the
# intentional lib/spec directory mirroring.
RSpec/SpecFilePathFormat:
  CustomTransform:
    GraphQL: graphql
  Exclude:
    - 'spec/graphql/derivation/pick_dsl/arguments_spec.rb'
    - 'spec/graphql/derivation/pick_dsl/fields_spec.rb'
    - 'spec/graphql/derivation/engines/argument_derivation_spec.rb'

RSpec/BeEq:
  Enabled: true

RSpec/BeNil:
  Enabled: true

RSpec/DescribedClassModuleWrapping:
  Enabled: true

RSpec/ExampleLength:
  Enabled: false

RSpec/ExpectChange:
  Enabled: false

RSpec/ExcessiveDocstringSpacing:
  Enabled: true

RSpec/IdenticalEqualityAssertion:
  Enabled: true

RSpec/IncludeExamples:
  Enabled: false

RSpec/NamedSubject:
  Enabled: false

RSpec/PredicateMatcher:
  Enabled: false

RSpec/StubbedMock:
  Enabled: false

RSpec/SubjectDeclaration:
  Enabled: true

Security/IoMethods:
  Enabled: true

Security/MarshalLoad:
  Enabled: true

Style/AccessModifierDeclarations:
  Enabled: true

Style/AccessorGrouping:
  Enabled: true

Style/BlockDelimiters:
  Enabled: true

Style/BisectedAttrAccessor:
  Enabled: true

Style/CollectionCompact:
  Enabled: true

Style/DateTime:
  Enabled: true

Style/DocumentDynamicEvalDefinition:
  Enabled: true

Style/Documentation:
  Enabled: false

Style/DoubleCopDisableDirective:
  Enabled: true

Style/EvenOdd:
  Enabled: true

Style/ExponentialNotation:
  Enabled: true

Style/FormatString:
  Enabled: true
  EnforcedStyle: percent

Style/FrozenStringLiteralComment:
  Enabled: true

Style/HashEachMethods:
  Enabled: true

Style/HashTransformKeys:
  Enabled: true

Style/HashTransformValues:
  Enabled: true

Style/InPatternThen:
  Enabled: true

Style/MapToHash:
  Enabled: true

Style/MethodDefParentheses:
  Enabled: true

Style/MinMax:
  Enabled: true

Style/MultilineInPatternThen:
  Enabled: true

Style/MutableConstant:
  Enabled: true

Style/NegatedUnless:
  Enabled: true

Style/PercentQLiterals:
  Enabled: true

Style/RedundantCapitalW:
  Enabled: true

Style/RedundantSelfAssignmentBranch:
  Enabled: true

Style/ReturnNil:
  Enabled: true

Style/SignalException:
  Enabled: true

Style/SingleArgumentDig:
  Enabled: true

Style/StringMethods:
  Enabled: true

Style/SwapValues:
  Enabled: true

Style/SymbolProc:
  Enabled: true

Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/UnlessLogicalOperators:
  Enabled: true

Style/ZeroLengthPredicate:
  Enabled: true
