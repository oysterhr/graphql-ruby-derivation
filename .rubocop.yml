# Generic Ruby style rules, ported from Oyster's `.rubocop_standard.yml`
# (../oyster/.rubocop_standard.yml) minus Rails-specific cops and the
# Oyster-internal custom cop files, neither of which apply to a standalone
# gem. See AGENTS.md "Decisions on record" for why this base was chosen.

plugins:
  - rubocop-performance
  - rubocop-rspec

AllCops:
  SuggestExtensions: false
  NewCops: enable
  TargetRubyVersion: 3.1
  # `Exclude` under `AllCops` overrides (rather than merges with) RuboCop's
  # built-in default excludes unless told to merge -- without this,
  # specifying our own `Exclude` below would un-exclude the top-level
  # `vendor/**/*` that RuboCop's defaults already cover.
  inherit_mode:
    merge:
      - Exclude
  # RuboCop's built-in default excludes only cover a top-level `vendor/**/*`;
  # `gemfiles/graphql_2.1.gemfile` (SPEC.md §12.6) installs its own bundle
  # under `gemfiles/vendor/`, which needs its own exclude.
  Exclude:
    - 'gemfiles/vendor/**/*'
    - 'gemfiles/.bundle/**/*'

### Cops ###

Bundler/GemFilename:
  Enabled: true

Bundler/OrderedGems:
  Enabled: true

Gemspec/OrderedDependencies:
  Enabled: true

# SPEC.md §1.2 explicitly requires the optional Rails/AR dependencies
# (activesupport, actionpack, ...) to be declared in the gemspec as
# development dependencies (consumed via require guards), so the gem advertises
# its optional integration surface in one place. This cop's "put dev deps in
# the Gemfile" preference contradicts that recorded decision (AGENTS.md), so it
# is disabled for the gemspec rather than worked around.
Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/RubyVersionGlobalsUsage:
  Enabled: true

Gemspec/RequiredRubyVersion:
  Enabled: true

