name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for a public repo: read-only unless a job
# explicitly needs more (none currently do).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SPEC.md §12.6 "graphql-ruby version matrix": run the real suite
        # against both ends of the supported graphql-ruby range (§1.2/§8.2),
        # not just the current release.
        bundle_gemfile:
          - Gemfile
          - gemfiles/graphql_2.1.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.bundle_gemfile }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.bundle_gemfile == 'Gemfile' && 'vendor/bundle' || 'gemfiles/vendor/bundle' }}
          key: ${{ runner.os }}-bundle-${{ hashFiles(matrix.bundle_gemfile) }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: bundle install
        run: nix develop --command bash -c 'bundle install --jobs 4 --retry 3'

      - name: rspec
        run: nix develop --command bash -c 'bundle exec rspec'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundle-${{ hashFiles('Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: bundle install
        run: nix develop --command bash -c 'bundle install --jobs 4 --retry 3'

      - name: rubocop
        run: nix develop --command bash -c 'bundle exec rubocop'
