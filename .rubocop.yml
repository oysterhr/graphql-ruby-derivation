Metrics/BlockNesting:
  Enabled: true

Metrics/BlockLength:
  Enabled: true
  Max: 192
  Exclude:
    # ControllerConcern's `class_methods do ... end` (ActiveSupport::Concern's
    # DSL) is one long block by construction -- it's where every class-level
    # DSL method (`argument`, `arguments_from`, `resource_arguments`, etc.,
    # SPEC.md §8.1) lives. Splitting it up would mean moving methods out of
    # the `class_methods` block into a separate module, which would obscure
    # (rather than clarify) that they're all part of one DSL.
    - 'lib/graphql/derivation/rails/controller_concern.rb'

Metrics/ClassLength:
  Enabled: true
  Max: 494

Metrics/ModuleLength:
  Enabled: true
  Max: 451

Naming/AccessorMethodName:
